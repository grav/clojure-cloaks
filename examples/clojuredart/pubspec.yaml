name: cljd_clojuredart
description: A ClojureDart greeting app for iOS, web, and Linux.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: NotoEmoji
      fonts:
        - asset: assets/fonts/NotoEmoji.ttf
