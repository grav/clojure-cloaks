<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hello, Scittle</title>
  <script src="vendor/scittle.js"></script>
</head>
<body>
  <p id="greeting" role="status">Hello, world!</p>
  <button id="hello">Say hello</button>

  <script type="application/x-scittle">
    (def clicks (atom 0))

    (.addEventListener (.getElementById js/document "hello") "click"
      (fn [_]
        (set! (.-textContent (.getElementById js/document "greeting"))
              (str "Hello from Scittle! Click #" (swap! clicks inc)))))
  </script>
</body>
</html>
